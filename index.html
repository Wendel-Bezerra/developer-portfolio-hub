    <script>
      // Ajusta título/descrição por idioma antes do app montar (o HTML servido
      // é o mesmo para /, /en e /es).
      (function () {
        var p = location.pathname;
        var meta = null;
        if (p === "/en" || p.indexOf("/en/") === 0) {
          meta = {
            title: "Wendel Campos Bezerra | Full Stack Developer",
            desc: "Wendel Campos Bezerra - Full Stack Developer specialized in Java, Node.js, React and Python. Check out my projects and get in touch."
          };
        } else if (p === "/es" || p.indexOf("/es/") === 0) {
          meta = {
            title: "Wendel Campos Bezerra | Desarrollador Full Stack",
            desc: "Wendel Campos Bezerra - Desarrollador Full Stack especializado en Java, Node.js, React y Python. Mira mis proyectos y ponte en contacto."
          };
        }
        if (!meta) return;
        document.title = meta.title;
        var set = function (sel, value) {
          var el = document.querySelector(sel);
          if (el) el.setAttribute("content", value);
        };
        set('meta[name="description"]', meta.desc);
        set('meta[property="og:title"]', meta.title);
        set('meta[property="og:description"]', meta.desc);
        set('meta[name="twitter:title"]', meta.title);
        set('meta[name="twitter:description"]', meta.desc);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", "https://www.wendelcb.dev" + p);
      })();
